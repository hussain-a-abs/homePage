<div class="surface-page flex justify-center ">
  <div class="w-full max-w-6xl">
    <div class="bento-grid">
      <app-hero-tile class="bento-hero" />
      <app-projects-tile />
      @for (cert of data.certs(); track $index) {
        <app-certs-tile  [cert]="cert"></app-certs-tile>
      }
      <app-stack-tile ></app-stack-tile>
      @if(data.availability()){
        <app-work-availability-tile [availability]="data.availability()!"></app-work-availability-tile>
      }
      @defer () {
        <app-github-activity-tile class="bento-hero"></app-github-activity-tile>
      }
      <app-contact-tile class=""></app-contact-tile>
      <!-- todo: add the rest of the tiles -->
    </div>
  </div>
</div>
